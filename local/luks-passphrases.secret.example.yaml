# Example Secret for the per-version root LUKS passphrases.
#
# The API reads env var LUKS_PASSPHRASES from secret `luks-passphrases`, key `passphrases`
# (wired in charts/templates/_helpers.tpl). The value is a JSON object mapping measurement
# version -> passphrase. The passphrase is ONLY returned by /boot/attestation, and boot
# attestation rejects any version below TEE_MINIMUM_BOOT_VERSION *before* the passphrase
# lookup. So you only need entries for versions >= the minimum boot version; older versions
# (e.g. 1.1.0, 1.2.0) can never reach the lookup and don't need a passphrase.
#
# There is NO fallback: every version at/above the minimum that can attest MUST have an entry,
# or /boot/attestation 500s for it. The example below assumes minimum boot version = 1.3.0,
# so it covers 1.3.0, 1.3.1, and the 1.3.1-rc release-candidate split.
#
# Caveat: semver ranks "1.3.1-rc" below "1.3.1" (prerelease). With minimum 1.3.0 it still
# passes; but if you ever raise the minimum to 1.3.1, the 1.3.1-rc VMs would be rejected at
# boot (and its passphrase entry becomes unnecessary).
#
# Generate a strong passphrase per version, e.g.:
#   python -c "import secrets; print(secrets.token_hex(32))"
#
# stringData lets you paste plaintext; Kubernetes base64-encodes it on apply.
#
# Apply with:
#   kubectl apply -f local/luks-passphrases.secret.example.yaml
# Or create/rotate imperatively from a JSON file:
#   kubectl create secret generic luks-passphrases \
#     --namespace chutes \
#     --from-file=passphrases=./passphrases.json \
#     --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: luks-passphrases
  namespace: chutes
type: Opaque
stringData:
  passphrases: |
    {
      "1.3.0": "REPLACE_WITH_PASSPHRASE_1_3_0",
      "1.3.1": "REPLACE_WITH_PASSPHRASE_1_3_1",
      "1.3.1-rc": "REPLACE_WITH_PASSPHRASE_1_3_1_RC"
    }
