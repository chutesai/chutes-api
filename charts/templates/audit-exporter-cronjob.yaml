{{- if .Values.auditExporter.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-exporter
  labels:
    {{- include "auditExporter.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.auditExporter.schedule | default "1 * * * *" | quote }}
  suspend: {{ .Values.auditExporter.suspend | default false }}
  successfulJobsHistoryLimit: {{ include "chutes.successfulJobsHistoryLimit" (dict "root" . "job" .Values.auditExporter) }}
  failedJobsHistoryLimit: {{ include "chutes.failedJobsHistoryLimit" (dict "root" . "job" .Values.auditExporter) }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: {{ include "chutes.ttlSecondsAfterFinished" (dict "root" . "job" .Values.auditExporter) }}
      backoffLimit: 5
      template:
        metadata:
          labels:
            {{- include "auditExporter.labels" . | nindent 12 }}
            {{- include "chutes.dbAccess" . | nindent 12 }}
            {{- include "chutes.redisAccess" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          securityContext:
            {{- include "chutes.podSecurityContext" . | nindent 12 }}
          tolerations:
            {{- include "chutes.defaultTolerations" . | nindent 12 }}
          {{- with .Values.auditExporter.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: tmpdir
              emptyDir: {}
            {{- include "chutes.redisCacertVolume" . | nindent 12 }}
          containers:
            - name: audit-export
              image: {{ include "chutes.image" (list . .Values.auditExporter.image) | quote }}
              imagePullPolicy: Always
              securityContext:
                {{- include "chutes.containerSecurityContext" . | nindent 16 }}
              command:
                - uv
                - run
                - python
                - audit_exporter.py
              env:
                {{- include "chutes.cronjobEnv" (dict "Values" .Values "ss58Literal" .Values.auditExporter.validatorSs58) | nindent 16 }}
                {{- if .Values.auditExporter.s3ProxyUrl }}
                - name: S3_PROXY_URL
                  value: {{ .Values.auditExporter.s3ProxyUrl | quote }}
                {{- end }}
                - name: SUBTENSOR_ADDRESS
                  value: {{ .Values.auditExporter.subtensor | default "ws://subtensor:9944" | quote }}
                - name: VALIDATOR_SEED
                  valueFrom:
                    secretKeyRef:
                      key: seed
                      name: validator-credentials
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3SecretName | default "s3-credentials" }}
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3SecretName | default "s3-credentials" }}
                      key: secret-access-key
                - name: AWS_ENDPOINT_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3SecretName | default "s3-credentials" }}
                      key: endpoint-url
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3SecretName | default "s3-credentials" }}
                      key: aws-region
                - name: STORAGE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3SecretName | default "s3-credentials" }}
                      key: bucket
              volumeMounts:
                - name: tmpdir
                  mountPath: /tmp
                {{- include "chutes.redisCacertMount" . | nindent 16 }}
              resources:
                {{- include "chutes.cronjobResources" .Values.auditExporter.resources | nindent 16 }}
{{- end }}
