apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-socket
  labels:
    {{- include "eventSocket.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.eventSocket.replicaCount }}
  selector:
    matchLabels:
      {{- include "eventSocket.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eventSocket.labels" . | nindent 8 }}
      annotations:
        chutes.ai/structured-logs: "true"
    spec:
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      {{- with .Values.eventSocket.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eventSocket.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.eventSocket.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: structured-logs
          emptyDir: {}
        {{- include "chutes.redisCacertVolume" . | nindent 8 }}
      containers:
        - name: event-socket
          image: {{ include "chutes.image" (list . .Values.eventSocket.image) | quote }}
          imagePullPolicy: {{ .Values.eventSocket.imagePullPolicy }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          command:
            - uv
            - run
            - uvicorn
            - api.event_socket_server:app
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.eventSocket.service.targetPort | quote }}
          env:
            - name: VALIDATOR_SS58
              valueFrom:
                secretKeyRef:
                  name: validator-credentials
                  key: ss58
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            {{- if .Values.redis.cacertSecret }}
            - name: REDIS_CACERT
              value: "/etc/redis-cacert/cacert.pem"
            {{- end }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRESQL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: url
            - name: POSTGRESQL_RO
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: readonly_url
          volumeMounts:
            - name: structured-logs
              mountPath: /var/log/app
            {{- include "chutes.redisCacertMount" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.eventSocket.service.targetPort }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.eventSocket.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.eventSocket.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.eventSocket.livenessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.eventSocket.livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.eventSocket.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.eventSocket.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.eventSocket.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.eventSocket.readinessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.eventSocket.readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.eventSocket.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.eventSocket.resources | nindent 12 }}
