{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: graval-worker-netpol
spec:
  # WARNING: selects `app: graval-worker` (no pod carries that label) -> inert. See claude-proxy-netpol.
  podSelector:
    matchLabels:
      app: graval-worker
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 8080
      protocol: TCP
  egress:
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: pg-router
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 443
      protocol: TCP
  - ports:
    - port: 5432
      protocol: TCP
    - port: 6378
      protocol: TCP
    to:
    - ipBlock:
        cidr: {{ .Values.networkPolicies.internalCidr }}
{{- end }}
