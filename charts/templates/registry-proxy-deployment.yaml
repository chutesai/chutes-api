apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-proxy
  labels:
    {{- include "registryProxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.registryProxy.hpa.enabled }}
  replicas: {{ .Values.registryProxy.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.registryProxy.strategy | default "RollingUpdate" }}
    {{- if eq (.Values.registryProxy.strategy | default "RollingUpdate") "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ (.Values.registryProxy.rollingUpdate | default dict).maxSurge | default "25%" }}
      maxUnavailable: {{ (.Values.registryProxy.rollingUpdate | default dict).maxUnavailable | default "25%" }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "registryProxy.labels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # nginx.conf is rendered by the render-config init container at pod start, so a
        # ConfigMap-only change syncs green in Argo and the running pods keep serving the old
        # config forever. Roll the pods when the template changes.
        checksum/config: {{ include (print $.Template.BasePath "/registry-proxy-cm.yaml") . | sha256sum }}
      labels:
        {{- include "registryProxy.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      {{- with .Values.registryProxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registryProxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.registryProxy.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      initContainers:
        - name: render-config
          image: {{ include "chutes.image" (list . (.Values.registryProxy.busyboxImage | default "busybox:1.36")) | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          resources:
            limits:
              ephemeral-storage: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          command:
            - sh
            - -c
            - |
              sed -e "s|\${DEPOT_REGISTRY}|${DEPOT_REGISTRY}|g" \
                  -e "s|\${DEPOT_BASIC_AUTH}|${DEPOT_BASIC_AUTH}|g" \
                  -e "s|\${REGISTRY_PROXY_SECRET}|${REGISTRY_PROXY_SECRET}|g" \
                  /templates/nginx.conf.template > /rendered/nginx.conf
          env:
            - name: DEPOT_REGISTRY
              valueFrom:
                secretKeyRef:
                  key: registry
                  name: depot-credentials
            - name: DEPOT_BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  key: registry-basic-auth
                  name: depot-credentials
            # Shared secret proving the /auth subrequest came through this proxy. Injected as
            # X-Registry-Proxy-Auth; empty (and unenforced) unless proxyAuthSecret.name is set.
            - name: REGISTRY_PROXY_SECRET
              {{- if .Values.registryProxy.proxyAuthSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registryProxy.proxyAuthSecret.name }}
                  key: {{ .Values.registryProxy.proxyAuthSecret.key | default "secret" }}
              {{- else }}
              value: ""
              {{- end }}
          volumeMounts:
            - name: registry-proxy-template
              mountPath: /templates
            - name: registry-proxy-rendered
              mountPath: /rendered
      containers:
        - name: proxy
          image: {{ include "chutes.image" (list . .Values.registryProxy.image) | quote }}
          imagePullPolicy: {{ .Values.registryProxy.imagePullPolicy }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: {{ .Values.registryProxy.containerPortName | default "http" }}
              containerPort: {{ .Values.registryProxy.containerPort | default 5000 }}
              protocol: TCP
          resources:
            {{- toYaml .Values.registryProxy.resources | nindent 12 }}
          volumeMounts:
            - name: registry-proxy-rendered
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: registry-proxy-tls
              mountPath: /etc/nginx/ssl
              readOnly: true
      volumes:
        - name: registry-proxy-template
          configMap:
            name: registry-proxy-config
        - name: registry-proxy-rendered
          emptyDir: {}
        - name: registry-proxy-tls
          secret:
            secretName: {{ .Values.registryProxy.tlsSecretName | default "registry-proxy-tls" }}
