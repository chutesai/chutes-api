apiVersion: apps/v1
kind: Deployment
metadata:
  name: socket
  labels:
    {{- include "socket.labels" . | nindent 4 }}
    {{- include "chutes.dbAccess" . | nindent 4 }}
    {{- include "chutes.redisAccess" . | nindent 4 }}
spec:
  {{- if not .Values.socket.hpa.enabled }}
  replicas: {{ .Values.socket.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.socket.strategy | default "RollingUpdate" }}
    {{- if eq (.Values.socket.strategy | default "RollingUpdate") "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ (.Values.socket.rollingUpdate | default dict).maxSurge | default "25%" }}
      maxUnavailable: {{ (.Values.socket.rollingUpdate | default dict).maxUnavailable | default "25%" }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "socket.labels" . | nindent 6 }}
      {{- include "chutes.dbAccess" . | nindent 6 }}
      {{- include "chutes.redisAccess" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "socket.labels" . | nindent 8 }}
        {{- include "chutes.dbAccess" . | nindent 8 }}
        {{- include "chutes.redisAccess" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      {{- with .Values.socket.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.socket.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.socket.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "chutes.redisCacertVolume" . | nindent 8 }}
      containers:
        - name: socket
          image: {{ include "chutes.image" (list . .Values.socket.image) | quote }}
          imagePullPolicy: {{ .Values.socket.imagePullPolicy }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          command:
            - uv
            - run
            - uvicorn
            - api.socket_server:app
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.socket.service.targetPort | quote }}
          env:
            {{- include "chutes.loggingEnv" . | nindent 12 }}
            - name: VALIDATOR_SS58
              valueFrom:
                secretKeyRef:
                  name: validator-credentials
                  key: ss58
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            {{- if .Values.redis.cacertSecret }}
            - name: REDIS_CACERT
              value: "/etc/redis-cacert/cacert.pem"
            {{- end }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRESQL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: url
            - name: POSTGRESQL_RO
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: readonly_url
          volumeMounts:
            {{- include "chutes.redisCacertMount" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.socket.service.targetPort }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.socket.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.socket.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.socket.livenessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.socket.livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.socket.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.socket.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.socket.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.socket.readinessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.socket.readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.socket.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.socket.resources | nindent 12 }}
