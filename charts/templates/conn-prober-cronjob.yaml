{{- if .Values.connProber.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: conn-prober
  labels:
    {{- include "connProber.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.connProber.schedule | default "*/3 * * * *" | quote }}
  suspend: {{ .Values.connProber.suspend | default false }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 15000
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            {{- include "connProber.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          securityContext:
            {{- include "chutes.podSecurityContext" . | nindent 12 }}
          tolerations:
            {{- include "chutes.defaultTolerations" . | nindent 12 }}
          {{- with .Values.connProber.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            {{- include "chutes.redisCacertVolume" . | nindent 12 }}
          containers:
            - name: conn-prober
              image: {{ include "chutes.image" (list . .Values.connProber.image) | quote }}
              imagePullPolicy: {{ .Values.connProber.imagePullPolicy | default "Always" }}
              securityContext:
                {{- include "chutes.containerSecurityContext" . | nindent 16 }}
              command:
                - uv
                - run
                - python
                - conn_prober.py
              env:
                {{- include "chutes.cronjobEnv" . | nindent 16 }}
                - name: VALIDATOR_SEED
                  valueFrom:
                    secretKeyRef:
                      name: validator-credentials
                      key: seed
              volumeMounts:
                {{- include "chutes.redisCacertMount" . | nindent 16 }}
              resources:
                {{- include "chutes.cronjobResources" .Values.connProber.resources | nindent 16 }}
{{- end }}
