{{- if .Values.attestationProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attestation-proxy
  labels:
    {{- include "attestationProxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.attestationProxy.replicaCount | default 2 }}
  strategy:
    type: {{ .Values.attestationProxy.strategy | default "RollingUpdate" }}
    {{- if eq (.Values.attestationProxy.strategy | default "RollingUpdate") "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ (.Values.attestationProxy.rollingUpdate | default dict).maxSurge | default "25%" }}
      maxUnavailable: {{ (.Values.attestationProxy.rollingUpdate | default dict).maxUnavailable | default "25%" }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "attestationProxy.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "attestationProxy.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.attestationProxy.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.attestationProxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: attestation-proxy-template
          configMap:
            name: attestation-proxy-config
        - name: attestation-proxy-rendered
          emptyDir: {}
        - name: chutes-tls
          secret:
            secretName: {{ .Values.attestationProxy.tlsSecretName | default "chutes-tls" }}
      initContainers:
        # Renders nginx.conf.template -> nginx.conf, substituting ${ATTESTATION_PROXY_SECRET} so the
        # provenance secret is never stored in the ConfigMap. Mirrors registry-proxy / cvm-proxy.
        - name: render-config
          image: {{ include "chutes.image" (list . (.Values.attestationProxy.busyboxImage | default "busybox:1.36")) | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          resources:
            limits:
              ephemeral-storage: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
          command:
            - sh
            - -c
            - |
              sed -e "s|\${ATTESTATION_PROXY_SECRET}|${ATTESTATION_PROXY_SECRET}|g" \
                  /templates/nginx.conf.template > /rendered/nginx.conf
          env:
            # Same secret the API reads for ATTESTATION_PROXY_SECRET, so injected == expected. Injects
            # empty (legacy requests then fail the proxied guard) unless proxyAuthSecret.name is set.
            - name: ATTESTATION_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.attestationProxy.proxyAuthSecret.name | default "attestation-proxy-auth" }}
                  key: {{ .Values.attestationProxy.proxyAuthSecret.key | default "secret" }}
                  optional: true
          volumeMounts:
            - name: attestation-proxy-template
              mountPath: /templates
            - name: attestation-proxy-rendered
              mountPath: /rendered
      containers:
        - name: proxy
          image: {{ include "chutes.image" (list . .Values.attestationProxy.image) | quote }}
          imagePullPolicy: {{ .Values.attestationProxy.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          resources:
            {{- toYaml .Values.attestationProxy.resources | nindent 12 }}
          volumeMounts:
            - name: attestation-proxy-rendered
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: chutes-tls
              mountPath: /etc/nginx/ssl
              readOnly: true
{{- end }}
