apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    {{- include "chutes.dbAccess" . | nindent 4 }}
    {{- include "chutes.redisAccess" . | nindent 4 }}
spec:
  replicas: {{ .Values.forge.replicaCount | default 1 }}
  strategy:
    type: {{ .Values.forge.strategy | default "RollingUpdate" }}
    {{- if eq (.Values.forge.strategy | default "RollingUpdate") "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ (.Values.forge.rollingUpdate | default dict).maxSurge | default "25%" }}
      maxUnavailable: {{ (.Values.forge.rollingUpdate | default dict).maxUnavailable | default "25%" }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "forge.labels" . | nindent 6 }}
      {{- include "chutes.dbAccess" . | nindent 6 }}
      {{- include "chutes.redisAccess" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "forge.labels" . | nindent 8 }}
        {{- include "chutes.dbAccess" . | nindent 8 }}
        {{- include "chutes.redisAccess" . | nindent 8 }}
      annotations:
        chutes.ai/structured-logs: "true"
    spec:
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: timeout
            value: "3"
          - name: attempts
            value: "3"
      {{- with .Values.forge.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.forge.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.forge.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      initContainers:
        - name: update-hosts
          image: {{ include "chutes.image" (list . (.Values.forge.busyboxImage | default "busybox:1.36")) | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          resources:
            limits:
              ephemeral-storage: 1Gi
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
          env:
            - name: VALIDATOR_SS58
              valueFrom:
                secretKeyRef:
                  key: ss58
                  name: validator-credentials
          command:
            - sh
            - -c
            - |
              set -e
              DOMAIN="${VALIDATOR_SS58}.localregistry.chutes.ai"
              echo "Adding host entry for $DOMAIN -> $REGISTRY_SERVICE_HOST"

              cp /etc/hosts /mnt/hosts
              echo "$REGISTRY_SERVICE_HOST  $DOMAIN" >> /mnt/hosts
          volumeMounts:
            - name: etc-hosts
              mountPath: /mnt
      containers:
        - name: forge
          image: {{ include "chutes.image" (list . .Values.forge.image) | quote }}
          imagePullPolicy: {{ .Values.forge.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "chutes.commonEnv" . | nindent 12 }}
            - name: CHUTES_VERSION
              value: {{ .Values.chutes_version | quote }}
            - name: VALIDATOR_SS58
              valueFrom:
                secretKeyRef:
                  name: validator-credentials
                  key: ss58
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url
            - name: LEGACY_DB_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: url
            {{- if .Values.chuteDb.enabled }}
            - name: DB_RW_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chuteDb.secretName | default "chutes-db" }}
                  key: rw_url
            - name: DB_RO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chuteDb.secretName | default "chutes-db" }}
                  key: ro_url
            {{- end }}
            - name: CFSV_OP
              valueFrom:
                secretKeyRef:
                  key: key
                  name: cfsvop
            - name: DOCKER_PULL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: docker-pull
                  key: username
            - name: DOCKER_PULL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docker-pull
                  key: password
            {{- if .Values.forge.depot.enabled }}
            - name: DEPOT_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: depot-credentials
            - name: DEPOT_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  key: project-id
                  name: depot-credentials
            - name: DEPOT_REGISTRY
              valueFrom:
                secretKeyRef:
                  key: registry
                  name: depot-credentials
            - name: DEPOT_REGISTRY_TOKEN
              valueFrom:
                secretKeyRef:
                  key: registry-token
                  name: depot-credentials
            - name: DEPOT_REGISTRY_RW_TOKEN
              valueFrom:
                secretKeyRef:
                  key: registry-rw-token
                  name: depot-credentials
            - name: PS_OP
              valueFrom:
                secretKeyRef:
                  key: ps-op
                  name: protecto
            {{- end }}
            - name: STORAGE_DRIVER
              value: "overlay"
            - name: STORAGE_OPTS
              value: "overlay.mount_program=/usr/bin/fuse-overlayfs"
            - name: BUILDAH_FORMAT
              value: "docker"
            - name: BUILDAH_ISOLATION
              value: "chroot"
            - name: PYTHONPATH
              value: "/forge"
            - name: BUILDAH_LAYERS
              value: "true"
            - name: BUILDAH_PARALLEL_PULL
              value: "1"
            - name: BUILDAH_LAYERS_PARALLEL_PULL
              value: "1"
            - name: BUILDAH_PULL_JOBS
              value: "16"
            - name: BUILDAH_PROGRESS
              value: plain
            - name: BUILDAH_PARALLEL_PUSH
              value: "1"
            - name: BUILDAH_LAYERS_PARALLEL_PUSH
              value: "1"
            - name: BUILDAH_PUSH_JOBS
              value: "16"
            - name: COSIGN_KEY
              value: /etc/cosign/cosign.key
            - name: COSIGN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cosign-signing-key
                  key: cosign.password
          volumeMounts:
            - name: cosign-key
              mountPath: /etc/cosign
              readOnly: true
            - name: etc-hosts
              mountPath: /etc/hosts
              subPath: hosts
            {{- include "chutes.redisCacertMount" . | nindent 12 }}
            {{- with .Values.forge.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: structured-logs
              mountPath: /var/log/app
          resources:
            {{- toYaml .Values.forge.resources | nindent 12 }}
      volumes:
        - name: cosign-key
          secret:
            secretName: cosign-signing-key
            items:
              - key: cosign.key
                path: cosign.key
                mode: 0444
        - name: etc-hosts
          emptyDir: {}
        - name: structured-logs
          emptyDir: {}
        {{- include "chutes.redisCacertVolume" . | nindent 8 }}
        {{- with .Values.forge.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
