apiVersion: v1
kind: Service
metadata:
  name: event-socket
  labels:
    {{- include "eventSocket.labels" . | nindent 4 }}
spec:
  type: {{ .Values.eventSocket.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.eventSocket.service.port }}
      targetPort: {{ .Values.eventSocket.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: event-socket
