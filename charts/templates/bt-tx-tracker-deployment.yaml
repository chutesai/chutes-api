{{- if .Values.btTxTracker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bt-tx-tracker
  labels:
    {{- include "btTxTracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.btTxTracker.replicaCount | default 0 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "btTxTracker.labels" . | nindent 6 }}
      {{- include "chutes.dbAccess" . | nindent 6 }}
      {{- include "chutes.redisAccess" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "btTxTracker.labels" . | nindent 8 }}
        {{- include "chutes.dbAccess" . | nindent 8 }}
        {{- include "chutes.redisAccess" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      {{- with .Values.btTxTracker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.btTxTracker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.btTxTracker.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "chutes.redisCacertVolume" . | nindent 8 }}
      containers:
        - name: bt-tx-tracker
          image: {{ include "chutes.image" (list . .Values.btTxTracker.image) | quote }}
          imagePullPolicy: {{ .Values.btTxTracker.imagePullPolicy }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          command:
            - uv
            - run
            - uvicorn
            - api.payment.history_tracker:app
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.btTxTracker.service.targetPort | quote }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            {{- if .Values.redis.cacertSecret }}
            - name: REDIS_CACERT
              value: "/etc/redis-cacert/cacert.pem"
            {{- end }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRESQL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: url
            - name: POSTGRESQL_RO
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: readonly_url
            - name: SUBTENSOR_ADDRESS
              value: {{ .Values.btTxTracker.subtensor | quote }}
          volumeMounts:
            {{- include "chutes.redisCacertMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.btTxTracker.resources | nindent 12 }}
{{- end }}
