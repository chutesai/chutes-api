apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-proxy-config
  labels:
    {{- include "registryProxy.labels" . | nindent 4 }}
data:
  nginx.conf.template: |
    user www-data;
    worker_processes {{ .Values.registryProxy.config.workerProcesses | default 64 }};
    pid /run/nginx.pid;
    include /etc/nginx/modules-enabled/*.conf;
    events {
        worker_connections {{ .Values.registryProxy.config.workerConnections | default 4096 }};
    }
    http {
        server_tokens off;
        ignore_invalid_headers off;
        client_max_body_size 0;

        # Rewrite service param: clients see registry.chutes.ai, Depot expects its own hostname.
        map $arg_service $rewritten_service {
            "registry.chutes.ai"       "${DEPOT_REGISTRY}";
            default                    "${DEPOT_REGISTRY}";
        }
        # Token realm follows the same cert-vs-hotkey split as /auth: mTLS VMs (cert present)
        # get a token from the registry itself; legacy VMs (no cert, arriving via the miner
        # proxy) keep the existing miner-proxy realm unchanged. The cert is forwarded by the
        # front-end LB as X-Client-Cert, so we key off that header.
        map $http_x_client_cert $token_realm {
            default "https://registry.chutes.ai/v2/_token";
            ""      "{{ .Values.registryProxy.config.tokenRealm | default "https://registry.chutes.ai/v2/_token" }}";
        }
        log_format proxylog '$remote_addr\t$http_x_chutes_hotkey\t[$time_local] ($request_time) '
                    '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $content_length $http_host';

        server {
            access_log /var/log/nginx/access.log proxylog;
            sendfile on;
            tcp_nopush on;
            listen 443 ssl;
            # Registry auth resolves the VM by its source IP. Behind the front-end LB, recover the
            # real client IP it forwards as X-Real-IP (internalCidr covers the SNAT'd node IP under
            # externalTrafficPolicy: Cluster; realIpFrom is the front-end sources).
            set_real_ip_from {{ .Values.networkPolicies.internalCidr }};
            {{- range .Values.registryProxy.realIpFrom }}
            set_real_ip_from {{ . }};
            {{- end }}
            real_ip_header X-Real-IP;
            ssl_certificate     /etc/nginx/ssl/tls.crt;
            ssl_certificate_key /etc/nginx/ssl/tls.key;
            ssl_protocols       TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;
            ssl_prefer_server_ciphers on;
            # Vestigial: the front-end does the VM mTLS now. Kept harmless.
            ssl_verify_client optional_no_ca;

            # Block pulls of intermediate build tags (never externally accessible).
            location ~ "^/v2/.+/manifests/forgebuild-" {
                return 403;
            }

            # Token endpoint - verify hotkey, then proxy to Depot's token service with Depot creds.
            location /v2/_token {
                auth_request /auth;

                resolver kube-dns.kube-system.svc.cluster.local;
                proxy_pass https://api.depot.dev/auth/registry/token?service=$rewritten_service&scope=$arg_scope;
                proxy_ssl_server_name on;
                proxy_ssl_name api.depot.dev;
                proxy_set_header Host api.depot.dev;

                # Inject Depot registry credentials (substituted at runtime by init container)
                proxy_set_header Authorization "Basic ${DEPOT_BASIC_AUTH}";
            }

            location /v2/ {
                limit_except GET HEAD {
                    deny all;
                }
                resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
                set $depot_upstream "${DEPOT_REGISTRY}";
                proxy_pass https://$depot_upstream$request_uri;

                proxy_ssl_server_name on;
                proxy_ssl_name ${DEPOT_REGISTRY};
                proxy_set_header Host ${DEPOT_REGISTRY};

                # Pass through bearer tokens from Docker client
                proxy_set_header Authorization $http_authorization;

                # Hide upstream identity from clients.
                proxy_hide_header Www-Authenticate;
                proxy_hide_header Docker-Distribution-Api-Version;
                proxy_hide_header X-Registry-Supports-Signatures;
                add_header Www-Authenticate 'Bearer realm="$token_realm",service="registry.chutes.ai"' always;

                proxy_redirect https://${DEPOT_REGISTRY}/ https://registry.chutes.ai/;

                proxy_request_buffering off;
                proxy_buffering off;
                proxy_http_version 1.1;
                proxy_connect_timeout 5s;
                proxy_next_upstream error timeout http_502 http_503 http_504;
                proxy_next_upstream_tries 3;
                proxy_read_timeout 900s;
                proxy_send_timeout 900s;
            }

            location = /auth {
                internal;
                proxy_pass http://api.{{ .Release.Namespace }}.svc.cluster.local:8000/registry/auth;
                proxy_set_header X-Chutes-Hotkey $http_x_chutes_hotkey;
                proxy_set_header X-Chutes-Signature $http_x_chutes_signature;
                proxy_set_header X-Chutes-Nonce $http_x_chutes_nonce;
                # Forward the cert the front-end LB set (it overwrites any client value, so it is
                # not spoofable). Empty for legacy VMs that present none.
                proxy_set_header X-Client-Cert $http_x_client_cert;
                proxy_set_header X-Client-Verify $ssl_client_verify;
                # Prove this request arrived via the registry proxy so the API can trust
                # X-Client-Cert / X-Real-IP. Empty unless proxyAuthSecret is configured.
                proxy_set_header X-Registry-Proxy-Auth "${REGISTRY_PROXY_SECRET}";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                error_page 401 403 500 502 503 504 = @block;
            }

            location @block {
                return 401;
            }
        }
    }
