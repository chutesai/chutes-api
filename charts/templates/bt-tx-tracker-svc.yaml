{{- if .Values.btTxTracker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: bt-tx-tracker
  labels:
    {{- include "btTxTracker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.btTxTracker.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.btTxTracker.service.port }}
      targetPort: {{ .Values.btTxTracker.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "btTxTracker.labels" . | nindent 4 }}
{{- end }}
