{{- if .Values.metasync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: metagraph-syncer
  labels:
    {{- include "metasync.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.metasync.schedule | default "*/3 * * * *" | quote }}
  suspend: {{ .Values.metasync.suspend | default false }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 15000
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            {{- include "metasync.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          securityContext:
            {{- include "chutes.podSecurityContext" . | nindent 12 }}
          tolerations:
            {{- include "chutes.defaultTolerations" . | nindent 12 }}
            {{- with .Values.metasync.tolerations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.metasync.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.metasync.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            {{- include "chutes.redisCacertVolume" . | nindent 12 }}
          containers:
            - name: metagraph-syncer
              image: {{ include "chutes.image" (list . .Values.metasync.image) | quote }}
              imagePullPolicy: {{ .Values.metasync.imagePullPolicy }}
              securityContext:
                {{- include "chutes.containerSecurityContext" . | nindent 16 }}
              command:
                - uv
                - run
                - python
                - metasync/sync_metagraph.py
              env:
                {{- include "chutes.cronjobEnv" . | nindent 16 }}
                - name: SUBTENSOR_ADDRESS
                  value: {{ .Values.metasync.subtensor | quote }}
              volumeMounts:
                {{- include "chutes.redisCacertMount" . | nindent 16 }}
              resources:
                {{- toYaml .Values.metasync.resources | nindent 16 }}
{{- end }}
