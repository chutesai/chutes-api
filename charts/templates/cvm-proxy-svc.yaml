{{- if .Values.cvmProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cvm-proxy
  labels:
    {{- include "cvmProxy.labels" . | nindent 4 }}
  {{- with .Values.cvmProxy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.cvmProxy.service.type | default "LoadBalancer" }}
  sessionAffinity: None
  internalTrafficPolicy: Cluster
  # Preserve the real client source IP (cvm.chutes.ai routes straight to this LB with no
  # PROXY-protocol intermediary, so $remote_addr must be the VM, not a SNATed node IP).
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: true
  ports:
    - name: https
      port: {{ .Values.cvmProxy.service.port | default 8443 }}
      targetPort: 8443
      protocol: TCP
  selector:
    {{- include "cvmProxy.labels" . | nindent 4 }}
{{- end }}
