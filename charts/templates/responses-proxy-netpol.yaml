{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: responses-proxy-netpol
spec:
  # WARNING: selects `app: responses-proxy` (no pod carries that label) -> inert. See claude-proxy-netpol.
  podSelector:
    matchLabels:
      app: responses-proxy
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 8181
      protocol: TCP
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 34.111.142.178/32
{{- end }}
