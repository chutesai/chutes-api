{{- if .Values.paymentWatcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-watcher
  labels:
    {{- include "paymentWatcher.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.paymentWatcher.replicaCount }}
  selector:
    matchLabels:
      {{- include "paymentWatcher.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paymentWatcher.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      {{- with .Values.paymentWatcher.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.paymentWatcher.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.paymentWatcher.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "chutes.redisCacertVolume" . | nindent 8 }}
      containers:
        - name: payment-watcher
          image: {{ include "chutes.image" (list . .Values.paymentWatcher.image) | quote }}
          imagePullPolicy: {{ .Values.paymentWatcher.imagePullPolicy }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          command:
            - uv
            - run
            - uvicorn
            - api.payment.watcher:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          env:
            - name: VALIDATOR_SS58
              valueFrom:
                secretKeyRef:
                  name: validator-credentials
                  key: ss58
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            {{- if .Values.redis.cacertSecret }}
            - name: REDIS_CACERT
              value: "/etc/redis-cacert/cacert.pem"
            {{- end }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRESQL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: url
            - name: POSTGRESQL_RO
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: readonly_url
          volumeMounts:
            {{- include "chutes.redisCacertMount" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.paymentWatcher.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.paymentWatcher.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.paymentWatcher.livenessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.paymentWatcher.livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.paymentWatcher.livenessProbe.failureThreshold | default 15 }}
          resources:
            {{- toYaml .Values.paymentWatcher.resources | nindent 12 }}
{{- end }}
