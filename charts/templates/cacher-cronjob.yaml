apiVersion: batch/v1
kind: CronJob
metadata:
  name: cacher
  labels:
    {{- include "cacher.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cacher.schedule | default "*/10 * * * *" | quote }}
  suspend: {{ .Values.cacher.suspend | default false }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 15000
      template:
        metadata:
          labels:
            {{- include "cacher.labels" . | nindent 12 }}
            {{- include "chutes.dbAccess" . | nindent 12 }}
            {{- include "chutes.redisAccess" . | nindent 12 }}
        spec:
          restartPolicy: Never
          securityContext:
            {{- include "chutes.podSecurityContext" . | nindent 12 }}
          tolerations:
            {{- include "chutes.defaultTolerations" . | nindent 12 }}
            {{- with .Values.cacher.tolerations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.cacher.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cacher.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            {{- include "chutes.redisCacertVolume" . | nindent 12 }}
          containers:
            - name: cacher
              image: {{ include "chutes.image" (list . .Values.cacher.image) | quote }}
              imagePullPolicy: {{ .Values.cacher.imagePullPolicy }}
              securityContext:
                {{- include "chutes.containerSecurityContext" . | nindent 16 }}
              command:
                - uv
                - run
                - python
                - cacher.py
              env:
                {{- include "chutes.cronjobEnv" . | nindent 16 }}
              volumeMounts:
                {{- include "chutes.redisCacertMount" . | nindent 16 }}
              resources:
                {{- toYaml .Values.cacher.resources | nindent 16 }}
