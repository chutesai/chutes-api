{{- if and (not .Values.externalOperationWorker.enabled) (not .Values.externalOperationWorker.runInApi) }}
{{- fail "external operation polling must run in API pods or the dedicated externalOperationWorker deployment" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "api.labels" . | nindent 4 }}
    {{- include "chutes.dbAccess" . | nindent 4 }}
    {{- include "chutes.redisAccess" . | nindent 4 }}
spec:
  {{- if not (or .Values.api.hpa.enabled .Values.api.keda.enabled) }}
  # Omitted when an autoscaler (HPA or KEDA) owns the replica count, so syncs don't
  # fight it. Managed here only when neither is enabled.
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.api.rollingUpdate.maxSurge | default "25%" }}
      maxUnavailable: {{ .Values.api.rollingUpdate.maxUnavailable | default "25%" }}
  selector:
    matchLabels:
      {{- include "api.labels" . | nindent 6 }}
      {{- include "chutes.dbAccess" . | nindent 6 }}
      {{- include "chutes.redisAccess" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api.labels" . | nindent 8 }}
        {{- include "chutes.dbAccess" . | nindent 8 }}
        {{- include "chutes.redisAccess" . | nindent 8 }}
        {{- if .Values.loki.enabled }}
        loki-access: "true"
        {{- end }}
      {{- if not .Values.gmp.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /_metrics
        prometheus.io/port: {{ .Values.api.service.targetPort | quote }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds | default 180 }}
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.api.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if .Values.squad_enabled }}
        - name: squad-certs
          secret:
            secretName: squad-cert
            items:
              - key: squad_pub.pem
                path: squad_pub.pem
        {{- end }}
        - name: tee-measurements
          configMap:
            name: tee-measurements
        - name: signing-keys-bundle
          configMap:
            name: signing-keys-bundle
        {{- include "chutes.redisCacertVolume" . | nindent 8 }}
        - name: lc-certs
          secret:
            secretName: launch-config-certs
            items:
              - key: lc_jwt_public.pem
                path: lc_jwt_public.pem
              - key: lc_jwt_private.pem
                path: lc_jwt_private.pem
      containers:
        - name: api
          image: {{ include "chutes.image" (list . .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          command:
            - uv
            - run
            - uvicorn
            - api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.api.service.targetPort | quote }}
            - --limit-concurrency
            - {{ .Values.api.limitConcurrency | default 1024 | quote }}
            - --timeout-graceful-shutdown
            - {{ .Values.api.timeoutGracefulShutdown | default 120 | quote }}
            - --loop
            - uvloop
            - --http
            - httptools
          env:
            {{- include "chutes.sensitiveEnv" . | nindent 12 }}
            {{- include "chutes.commonEnv" . | nindent 12 }}
            {{- include "chutes.loggingEnv" . | nindent 12 }}
            - name: BASE_DOMAIN
              value: {{ .Values.baseDomain | default "chutes.ai" | quote }}
            - name: PASSPHRASE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: passphrase-encryption-key
                  key: key
            - name: CHUTES_VERSION
              value: {{ .Values.api.chutesVersion | default .Values.chutes_version | quote }}
            - name: VALIDATOR_SS58
            {{- if .Values.api.validatorSs58 }}
              value: {{ .Values.api.validatorSs58 | quote }}
            {{- else }}
              valueFrom:
                secretKeyRef:
                  name: validator-credentials
                  key: ss58
            {{- end }}
            {{- if .Values.datadog_enabled }}
            - name: DD_LOGS_INJECTION
              value: "true"
            {{- end }}
            - name: LAUNCH_CONFIG_PRIVATE_KEY_PATH
              value: /etc/lc-certs/lc_jwt_private.pem
            - name: DB_POOL_SIZE
              value: {{ .Values.api.dbPoolSize | default 24 | quote }}
            - name: DB_OVERFLOW
              value: {{ .Values.api.dbOverflow | default 8 | quote }}
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus_multiproc
            - name: MAX_REQUEST_BODY_BYTES
              value: {{ .Values.api.maxRequestBodyBytes | default 134217728 | quote }}
            - name: EXTERNAL_ALLOW_INSECURE_UPSTREAMS
              value: {{ .Values.externalBackend.allowInsecureUpstreams | default false | quote }}
            - name: EXTERNAL_MAX_ACTIVE_TASKS_PER_USER
              value: {{ .Values.externalBackend.governance.maxActiveTasksPerUser | default 4 | quote }}
            - name: EXTERNAL_MAX_ACTIVE_TASKS_PER_ACCOUNT
              value: {{ .Values.externalBackend.governance.maxActiveTasksPerAccount | default 256 | quote }}
            - name: EXTERNAL_MAX_ACTIVE_SYNC_REQUESTS_PER_USER
              value: {{ .Values.externalBackend.governance.maxActiveSyncRequestsPerUser | default 8 | quote }}
            - name: EXTERNAL_MAX_ACTIVE_SYNC_REQUESTS_PER_ACCOUNT
              value: {{ .Values.externalBackend.governance.maxActiveSyncRequestsPerAccount | default 128 | quote }}
            - name: EXTERNAL_MAX_REALTIME_SESSIONS_PER_USER
              value: {{ .Values.externalBackend.governance.maxRealtimeSessionsPerUser | default 2 | quote }}
            - name: EXTERNAL_MAX_REALTIME_SESSIONS_PER_ACCOUNT
              value: {{ .Values.externalBackend.governance.maxRealtimeSessionsPerAccount | default 64 | quote }}
            - name: EXTERNAL_MAX_STREAMS_PER_USER
              value: {{ .Values.externalBackend.governance.maxStreamsPerUser | default 4 | quote }}
            - name: EXTERNAL_MAX_STREAMS_PER_ACCOUNT
              value: {{ .Values.externalBackend.governance.maxStreamsPerAccount | default 128 | quote }}
            - name: EXTERNAL_MAX_DAILY_OPERATIONS_PER_USER
              value: {{ .Values.externalBackend.governance.maxDailyOperationsPerUser | default 1000 | quote }}
            - name: EXTERNAL_MAX_DAILY_OPERATIONS_PER_ACCOUNT
              value: {{ .Values.externalBackend.governance.maxDailyOperationsPerAccount | default 100000 | quote }}
            - name: EXTERNAL_MAX_DAILY_PAYGO_USD_PER_USER
              value: {{ .Values.externalBackend.governance.maxDailyPaygoUsdPerUser | default 25 | quote }}
            - name: EXTERNAL_MAX_DAILY_PAYGO_USD_PER_ACCOUNT
              value: {{ .Values.externalBackend.governance.maxDailyPaygoUsdPerAccount | default 1000 | quote }}
            - name: EXTERNAL_MAX_ESTIMATED_OPERATION_COST_USD
              value: {{ .Values.externalBackend.governance.maxEstimatedOperationCostUsd | default 50 | quote }}
            - name: EXTERNAL_ARTIFACT_REQUESTS_PER_MINUTE
              value: {{ .Values.externalBackend.governance.artifactRequestsPerMinute | default 60 | quote }}
            - name: EXTERNAL_ARTIFACT_MAX_CONCURRENT_PER_USER
              value: {{ .Values.externalBackend.governance.artifactMaxConcurrentPerUser | default 3 | quote }}
            - name: EXTERNAL_ARTIFACT_MAX_BYTES_PER_OPERATION
              value: {{ .Values.externalBackend.governance.artifactMaxBytesPerOperation | default 10737418240 | quote }}
            - name: EXTERNAL_ARTIFACT_MAX_DAILY_BYTES_PER_USER
              value: {{ .Values.externalBackend.governance.artifactMaxDailyBytesPerUser | default 53687091200 | quote }}
            - name: EXTERNAL_POLLER_ENABLED
              value: {{ (and .Values.externalOperationWorker.runInApi (not .Values.externalOperationWorker.enabled)) | quote }}
            - name: EXTERNAL_POLLER_BATCH_SIZE
              value: {{ .Values.externalOperationWorker.poller.batchSize | default 16 | quote }}
            - name: EXTERNAL_POLLER_CONCURRENCY
              value: {{ .Values.externalOperationWorker.poller.concurrency | default 8 | quote }}
            - name: EXTERNAL_POLLER_LEASE_SECONDS
              value: {{ .Values.externalOperationWorker.poller.leaseSeconds | default 60 | quote }}
            - name: EXTERNAL_POLLER_IDLE_SECONDS
              value: {{ .Values.externalOperationWorker.poller.idleSeconds | default 1 | quote }}
            - name: EXTERNAL_POLLER_SHUTDOWN_TIMEOUT_SECONDS
              value: {{ .Values.externalOperationWorker.poller.shutdownTimeoutSeconds | default 30 | quote }}
            - name: EXTERNAL_SETTLEMENT_RECONCILE_INTERVAL_SECONDS
              value: {{ .Values.externalOperationWorker.poller.settlementReconcileIntervalSeconds | default 5 | quote }}
            - name: EXTERNAL_SETTLEMENT_BATCH_SIZE
              value: {{ .Values.externalOperationWorker.poller.settlementBatchSize | default 64 | quote }}
            - name: EXTERNAL_SETTLEMENT_QUARANTINE_ATTEMPTS
              value: {{ .Values.externalOperationWorker.poller.settlementQuarantineAttempts | default 8 | quote }}
            - name: EXTERNAL_OPERATION_MAINTENANCE_INTERVAL_SECONDS
              value: {{ .Values.externalOperationWorker.poller.maintenanceIntervalSeconds | default 60 | quote }}
            - name: EXTERNAL_OPERATION_RETENTION_DAYS
              value: {{ .Values.externalOperationWorker.poller.retentionDays | default 90 | quote }}
            - name: EXTERNAL_OPERATION_RETENTION_BATCH_SIZE
              value: {{ .Values.externalOperationWorker.poller.retentionBatchSize | default 1000 | quote }}
            - name: EXTERNAL_CIRCUIT_AUTH_FAILURE_THRESHOLD
              value: {{ .Values.externalBackend.circuit.authFailureThreshold | default 3 | quote }}
            - name: EXTERNAL_CIRCUIT_SERVICE_FAILURE_THRESHOLD
              value: {{ .Values.externalBackend.circuit.serviceFailureThreshold | default 10 | quote }}
            - name: EXTERNAL_CIRCUIT_COOLDOWN_SECONDS
              value: {{ .Values.externalBackend.circuit.cooldownSeconds | default 300 | quote }}
            - name: RATE_LIMIT_COUNT
              value: {{ .Values.api.rateLimitCount | default 10 | quote }}
            - name: OPENCL_GRAVAL_URL
              value: {{ .Values.api.openclGravalUrl | default "https://new-graval.chutes.ai:8443" | quote }}
            - name: CONSECUTIVE_FAILURE_LIMIT
              value: "{{ .Values.consecutive_failure_limit }}"
            {{- if .Values.teeMinimumBootVersion }}
            - name: TEE_MINIMUM_BOOT_VERSION
              value: "{{ .Values.teeMinimumBootVersion }}"
            {{- end }}
            # Provenance secrets are optional at the ENV level (optional: true) so the shared
            # validator image still starts where they aren't provisioned. Enforcement lives in the
            # per-request guards (require_attestation_proxy / require_cvm_proxy), which FAIL CLOSED
            # (503) when the secret is unset -- so a missing secret rejects attestation rather than
            # silently bypassing the check, without taking the whole API (or sibling apps) down.
            - name: ATTESTATION_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.attestationProxy.proxyAuthSecret.name | default "attestation-proxy-auth" }}
                  key: {{ .Values.attestationProxy.proxyAuthSecret.key | default "secret" }}
                  optional: true
            - name: CVM_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cvmProxy.proxyAuthSecret.name | default "cvm-proxy-auth" }}
                  key: {{ .Values.cvmProxy.proxyAuthSecret.key | default "secret" }}
                  optional: true
            {{- if .Values.loki.enabled }}
            # Dedicated chute-log-shipper Loki (in-namespace, not the ops cluster). When unset the
            # ingest endpoint accepts + drops shipments, so the feature is a safe no-op.
            - name: LOKI_URL
              value: "http://loki.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.loki.service.port }}"
            {{- end }}
            - name: REGISTRY_MTLS_MIN_VERSION
              value: "{{ .Values.registryMtlsMinVersion }}"
            - name: TEE_MTLS_MIN_VERSION
              value: "{{ .Values.teeMtlsMinVersion }}"
            {{- if .Values.registryProxy.proxyAuthSecret.name }}
            - name: REGISTRY_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registryProxy.proxyAuthSecret.name }}
                  key: {{ .Values.registryProxy.proxyAuthSecret.key | default "secret" }}
            {{- end }}
            - name: CM_REDIS_SHARD_COUNT
              value: "{{ .Values.cmRedis.shard_count }}"
            - name: SQUAD_CERT_PATH
              value: /etc/squad/squad_pub.pem
            # Mounted at its own dir (NOT under /etc/config, which the tee-measurements ConfigMap
            # already mounts -- a file subPath into another CM volume fails "not a directory").
            - name: SIGNING_KEYS_BUNDLE_PATH
              value: /etc/signing-keys/signing_keys_bundle.json
          volumeMounts:
            {{- if .Values.squad_enabled }}
            - name: squad-certs
              mountPath: "/etc/squad"
              readOnly: true
            {{- end }}
            - name: tee-measurements
              mountPath: "/etc/config"
              readOnly: true
            - name: signing-keys-bundle
              mountPath: "/etc/signing-keys"
              readOnly: true
            {{- include "chutes.redisCacertMount" . | nindent 12 }}
            - name: lc-certs
              mountPath: /etc/lc-certs
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.api.livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.api.readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
