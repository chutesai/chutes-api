apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.api.rollingUpdate.maxSurge | default "25%" }}
      maxUnavailable: {{ .Values.api.rollingUpdate.maxUnavailable | default "25%" }}
  selector:
    matchLabels:
      {{- include "api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /_metrics
        prometheus.io/port: "8000"
        chutes.ai/structured-logs: "true"
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds | default 180 }}
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.api.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if .Values.squad_enabled }}
        - name: squad-certs
          secret:
            secretName: squad-cert
            items:
              - key: squad_pub.pem
                path: squad_pub.pem
        {{- end }}
        - name: tee-measurements
          configMap:
            name: tee-measurements
        - name: structured-logs
          emptyDir: {}
        {{- include "chutes.redisCacertVolume" . | nindent 8 }}
        - name: lc-certs
          secret:
            secretName: launch-config-certs
            items:
              - key: lc_jwt_public.pem
                path: lc_jwt_public.pem
              - key: lc_jwt_private.pem
                path: lc_jwt_private.pem
      containers:
        - name: api
          image: {{ include "chutes.image" (list . .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          command:
            - uv
            - run
            - uvicorn
            - api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.api.service.targetPort | quote }}
            - --limit-concurrency
            - {{ .Values.api.limitConcurrency | default 1024 | quote }}
            - --timeout-graceful-shutdown
            - {{ .Values.api.timeoutGracefulShutdown | default 120 | quote }}
            - --loop
            - uvloop
            - --http
            - httptools
          env:
            {{- include "chutes.sensitiveEnv" . | nindent 12 }}
            {{- include "chutes.commonEnv" . | nindent 12 }}
            - name: LAUNCH_CONFIG_PRIVATE_KEY_PATH
              value: /etc/lc-certs/lc_jwt_private.pem
            - name: DB_POOL_SIZE
              value: {{ .Values.api.dbPoolSize | default 24 | quote }}
            - name: DB_OVERFLOW
              value: {{ .Values.api.dbOverflow | default 8 | quote }}
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus_multiproc
            - name: RATE_LIMIT_COUNT
              value: {{ .Values.api.rateLimitCount | default 10 | quote }}
            - name: OPENCL_GRAVAL_URL
              value: {{ .Values.api.openclGravalUrl | default "https://new-graval.chutes.ai:8443" | quote }}
            - name: CONSECUTIVE_FAILURE_LIMIT
              value: "{{ .Values.consecutive_failure_limit }}"
            - name: CM_REDIS_SHARD_COUNT
              value: "{{ .Values.cmRedis.shard_count }}"
            - name: STRUCTURED_LOG_ROTATION
              value: "{{ .Values.api.structuredLogRotation }}"
            {{- if .Values.teeMinimumBootVersion }}
            - name: TEE_MINIMUM_BOOT_VERSION
              value: "{{ .Values.teeMinimumBootVersion }}"
            {{- end }}
            {{- if .Values.squad_enabled }}
            - name: SQUAD_CERT_PATH
              value: /etc/squad/squad_pub.pem
            {{- end }}
            - name: LUKS_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  key: passphrase
                  name: luks-key
          volumeMounts:
            {{- if .Values.squad_enabled }}
            - name: squad-certs
              mountPath: "/etc/squad"
              readOnly: true
            {{- end }}
            - name: tee-measurements
              mountPath: "/etc/config"
              readOnly: true
            - name: structured-logs
              mountPath: /var/log/app
            {{- include "chutes.redisCacertMount" . | nindent 12 }}
            - name: lc-certs
              mountPath: /etc/lc-certs
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.api.livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.api.readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
