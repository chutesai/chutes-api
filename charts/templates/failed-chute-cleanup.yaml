{{- if .Values.failedChuteCleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: failed-chute-cleanup
  labels:
    {{- include "failedChuteCleanup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.failedChuteCleanup.schedule | default "*/15 * * * *" | quote }}
  suspend: {{ .Values.failedChuteCleanup.suspend | default false }}
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.failedChuteCleanup.activeDeadlineSeconds | default 900 }}
      backoffLimit: {{ .Values.failedChuteCleanup.backoffLimit | default 2 }}
      ttlSecondsAfterFinished: 15000
      template:
        metadata:
          labels:
            {{- include "failedChuteCleanup.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          securityContext:
            {{- include "chutes.podSecurityContext" . | nindent 12 }}
          tolerations:
            {{- include "chutes.defaultTolerations" . | nindent 12 }}
          {{- with .Values.failedChuteCleanup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            {{- include "chutes.redisCacertVolume" . | nindent 12 }}
          containers:
            - name: failed-chute-cleanup
              image: {{ include "chutes.image" (list . .Values.failedChuteCleanup.image) | quote }}
              imagePullPolicy: Always
              securityContext:
                {{- include "chutes.containerSecurityContext" . | nindent 16 }}
              command:
                - uv
                - run
                - python
                - failed_chute_cleanup.py
              env:
                {{- include "chutes.cronjobEnv" . | nindent 16 }}
              volumeMounts:
                {{- include "chutes.redisCacertMount" . | nindent 16 }}
              resources:
                {{- toYaml .Values.failedChuteCleanup.resources | nindent 16 }}
{{- end }}
