{{- if .Values.responsesProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: responses-proxy
  labels:
    {{- include "responsesProxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.responsesProxy.replicaCount | default 2 }}
  strategy:
    type: {{ .Values.responsesProxy.strategy | default "RollingUpdate" }}
    {{- if eq (.Values.responsesProxy.strategy | default "RollingUpdate") "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ (.Values.responsesProxy.rollingUpdate | default dict).maxSurge | default "25%" }}
      maxUnavailable: {{ (.Values.responsesProxy.rollingUpdate | default dict).maxUnavailable | default "25%" }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "responsesProxy.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "responsesProxy.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 300
      securityContext:
        {{- include "chutes.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "chutes.defaultTolerations" . | nindent 8 }}
        {{- with .Values.responsesProxy.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.responsesProxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: responses-proxy
          image: {{ include "chutes.image" (list . .Values.responsesProxy.image) | quote }}
          imagePullPolicy: {{ .Values.responsesProxy.imagePullPolicy | default "Always" }}
          securityContext:
            {{- include "chutes.containerSecurityContext" . | nindent 12 }}
          env:
            - name: HOST_PORT
              value: "8181"
            - name: BACKEND_URL
              value: {{ .Values.responsesProxy.backendUrl | default "http://api.chutes.svc.cluster.local:8000/v1/chat/completions" | quote }}
            - name: BACKEND_HOST_HEADER
              value: {{ .Values.responsesProxy.backendHostHeader | default "llm.chutes.ai" | quote }}
            - name: RUST_LOG
              value: "info"
            - name: CADDY_PORT
              value: "443"
            - name: CADDY_DOMAIN
              value: {{ .Values.responsesProxy.caddyDomain | default "responses.chutes.ai" | quote }}
            - name: BACKEND_TIMEOUT_SECS
              value: "600"
          ports:
            - name: http
              containerPort: 8181
              protocol: TCP
          resources:
            {{- toYaml .Values.responsesProxy.resources | nindent 12 }}
{{- end }}
