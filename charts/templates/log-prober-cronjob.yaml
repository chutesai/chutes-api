apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-prober
  labels:
    {{- include "logProber.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.logProber.schedule | default "*/3 * * * *" | quote }}
  suspend: {{ .Values.logProber.suspend | default false }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 15000
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            {{- include "logProber.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          securityContext:
            {{- include "chutes.podSecurityContext" . | nindent 12 }}
          tolerations:
            {{- include "chutes.defaultTolerations" . | nindent 12 }}
            {{- with .Values.logProber.tolerations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.logProber.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.logProber.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            {{- include "chutes.redisCacertVolume" . | nindent 12 }}
          containers:
            - name: log-prober
              image: {{ include "chutes.image" (list . .Values.logProber.image) | quote }}
              imagePullPolicy: {{ .Values.logProber.imagePullPolicy }}
              securityContext:
                {{- include "chutes.containerSecurityContext" . | nindent 16 }}
              command:
                - uv
                - run
                - python
                - log_prober.py
              env:
                {{- include "chutes.cronjobEnv" . | nindent 16 }}
                - name: VALIDATOR_SEED
                  valueFrom:
                    secretKeyRef:
                      name: validator-credentials
                      key: seed
              volumeMounts:
                {{- include "chutes.redisCacertMount" . | nindent 16 }}
              resources:
                {{- include "chutes.cronjobResources" .Values.logProber.resources | nindent 16 }}
