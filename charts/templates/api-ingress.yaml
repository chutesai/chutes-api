{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "false"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Chute-Id,X-Instance-Id,X-E2E-Nonce,X-E2E-Stream,X-E2E-Path,X-Enable-Thinking,X-Provider,X-Provider-Version,X-Title"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS, PUT, DELETE, PATCH"
    nginx.ingress.kubernetes.io/cors-expose-headers: "X-Chutes-Quota-Total,X-Chutes-Quota-Used,X-Chutes-Quota-Remaining,X-Chutes-RL-User,X-Chutes-RL-Chute,X-Chutes-InvocationID,Inference-Id"
    nginx.ingress.kubernetes.io/cors-max-age: "1728000"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_500 http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "45"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
    # Strip proxy-provenance headers from PUBLIC traffic so they can only ever be set by the
    # trusted mTLS/registry proxies (require_attestation_proxy / require_registry_proxy_secret,
    # _get_client_certificate). Without this, a request to api.chutes.ai carrying a forged
    # X-Client-Cert (+ X-Attestation-Proxy-Auth) could reach the attestation handlers directly.
    # more_clear_input_headers is provided by ingress-nginx's bundled headers-more module;
    # requires allow-snippet-annotations=true on the ingress controller.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_input_headers "X-Client-Cert" "X-Client-Verify" "X-Attestation-Proxy-Auth" "X-Registry-Proxy-Auth";
    {{- with .Values.ingress.whitelistSourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
  - host: '*.chutes.ai'
    http:
      paths:
      - backend:
          service:
            name: api
            port:
              number: 8000
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - '*.chutes.ai'
    secretName: {{ .Values.ingress.tlsSecretName | default "ingress-tls" }}
{{- end }}
