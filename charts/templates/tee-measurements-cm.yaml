apiVersion: v1
kind: ConfigMap
metadata:
  name: tee-measurements
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  tee_measurements.yaml: |
    # TEE Measurement Configuration
    # Managed via Helm values (teeMeasurements.measurements).
    # MRTD/RTMR1/RTMR2 (firmware, kernel/initrd) and runtime_rtmr3 are shared across all
    # hardware for a version; only RTMR0 (GPU topology) varies per hardware. Set `rc: true`
    # to mark a version a release candidate (attestable but excluded from the public list); an
    # rc version MUST also list `authorized_hotkeys` -- the miner hotkeys allowed to run it -- or
    # it is dropped as unusable at load time.
    #
    # Each hardware entry may carry `fingerprint`: the 64-hex topology fingerprint of the host
    # class it covers, linking it to the submitted host profile
    # (POST /servers/tdx/host_profiles). The measurement generator PROPAGATES this value -- it is
    # returned by POST and GET /servers/tdx/host_profiles -- and must
    # never recompute it another way. Optional (existing entries predate it), but an entry without one
    # is unmatchable: its host class reports "pending" forever even though it launches.
    measurements:
{{ .Values.teeMeasurements.measurements | toYaml | indent 6 }}
