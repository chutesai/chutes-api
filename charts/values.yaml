# Managed Redis connection (credentials from redis-secret)
redis:
  host: ""
  port: 6379
  # Name of a secret with a 'ca' key containing the TLS CA certificate (optional)
  cacertSecret: ""
  # File mode for the mounted CA cert, as an OCTAL integer (write the leading zero!).
  # 0444 = r--r--r-- (read-only): least-privilege-correct, since a mounted CA cert is only
  # ever read, never written (the owner-write bit in the k8s default 0644 is pure noise).
  # Non-functional regardless (secret volumes mount read-only). Renders to decimal 292.
  cacertMode: 0444

