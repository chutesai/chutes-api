# Dedicated single-instance Loki for the chute log shipper (pre-registration pod logs). This is
# NOT the ops monitoring cluster: it is platform-owned, in-namespace, bounded to 24h retention, and
# read by the API (owner/miner CLI) + the ops Grafana (as a datasource, over the internal network).
# The API pushes lines directly to it (never via stdout). Not client-reachable (NetworkPolicy).
loki:
  enabled: true
  image: grafana/loki:3.7.4
  imagePullPolicy: IfNotPresent
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi
  service:
    type: ClusterIP
    port: 3100
  # Bounded local storage; 24h retention keeps the footprint small.
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  retentionHours: 24
  # NetworkPolicy: Loki is default-deny and is NOT client-reachable. In-namespace clients (the API)
  # opt in via the `loki-access: "true"` pod label — that stays locked to the workloads this chart
  # deploys. Any OTHER peer that may reach Loki (e.g. the ops Grafana namespace) is cluster-specific
  # policy: set it here as a list of raw NetworkPolicy ingress `from` peers. The chart names no
  # external infra and defaults to none; the ops repo, which manages these values and has the
  # cluster-wide context, sets who/what may read Loki. Example (in the ops repo overlay):
  #   extraIngressFrom:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: monitoring
  extraIngressFrom: []

registry:
  enabled: true
  image: registry:3.0.0-rc.3
  imagePullPolicy: IfNotPresent
  replicaCount: 2
  nodeSelector: {}
  affinity:
    nodeAffinity: {}
  tolerations: []
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 5000
  config:
    redirectDisable: false
    type: "gcs"

registryProxy:
  image: nginx:1.31
  imagePullPolicy: IfNotPresent
  busyboxImage: busybox:1.36
  # Public *.chutes.ai cert (GoDaddy). When registry.chutes.ai points straight at this
  # Service's L4 LB, nginx faces the client directly, so the cert must be publicly trusted and
  # cover the host. registry-proxy-tls is a Cloudflare Origin cert (not publicly trusted) and
  # must NOT be used on the client-facing path.
  tlsSecretName: "chutes-tls"
  # Optional shared secret proving a /registry/auth request arrived via this proxy (defense in
  # depth: without it, anyone able to reach the API's /registry/auth off-proxy could spoof
  # X-Real-IP to force the legacy branch and bypass mTLS). When name is set, the proxy injects
  # it as X-Registry-Proxy-Auth and the API enforces it; leave name empty to disable. The
  # secret is created out of band (like attestation-proxy-auth) and its value must be sed-safe
  # (hex / base64url -- no '|' or '&').
  proxyAuthSecret:
    name: ""
    key: "secret"
  config:
    workerProcesses: 64
    workerConnections: 4096
    # tokenRealm: override the Www-Authenticate Bearer realm URL (default: https://registry.chutes.ai/v2/_token)
  replicaCount: 1
  nodeSelector: {}
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  affinity:
    nodeAffinity: {}
  tolerations: []
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: "1Gi"
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: "1Gi"
  service:
    type: LoadBalancer
    port: 443
    annotations: {}
    # Local preserves the real VM source IP on the GCP L4 LB (needed for registry auth's
    # IP-based VM resolution). Only override to Cluster if IP-based resolution is not used.
    externalTrafficPolicy: Local
    # Reserved static IP to pin the LB across reconciles (set in the overlay once the address
    # is reserved in GCP). Empty = let GKE assign an ephemeral IP.
    loadBalancerIP: ""

# autostaker runs as a CronJob (one-shot api/autostaker.py per tick), not a long-running
# worker. validatorSs58 left empty here -> cronjobEnv falls back to the validator-credentials
# secret; set a literal in the overlay to match prod.
autostaker:
  enabled: true
  image: validator:latest
  imagePullPolicy: Always
  schedule: "* * * * *"
  suspend: false
  # Retain more staking Job history than the global default.
  successfulJobsHistoryLimit: 15
  failedJobsHistoryLimit: 15
  ttlSecondsAfterFinished: 21600
  subtensor: "wss://entrypoint-finney.opentensor.ai"
  validatorSs58: ""
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
      ephemeral-storage: "1Gi"
    limits:
      ephemeral-storage: "1Gi"
  affinity: {}
  tolerations: []

# New services (disabled by default -- enable in your overlay values)
attestationProxy:
  enabled: false
  replicaCount: 2
  image: nginx:1.31
  imagePullPolicy: IfNotPresent
  busyboxImage: busybox:1.36
  tlsSecretName: "chutes-tls"
  # Secret the render init container and the API both read (must be the SAME value, so the
  # injected X-Attestation-Proxy-Auth matches what the API enforces). Wired optional so the pod
  # starts if unprovisioned; the API guard then fails closed (503) rather than bypassing.
  proxyAuthSecret:
    name: "attestation-proxy-auth"
    key: "secret"
  serverName: "tdx-attestation.chutes.ai"
  # Placeholder source ranges (RFC5737 docs net). Set the real trusted real-IP sources in the
  # overlay -- these are environment-specific load-balancer/NAT addresses.
  realIpFrom:
    - "192.0.2.1"
    - "192.0.2.2"
    - "192.0.2.3"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: "1Gi"
    limits:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: "1Gi"
  service:
    type: LoadBalancer
    # Reserved static LB IP (empty = GCP auto-assigns). Pin in the overlay so the IP survives a
    # Service recreate and tdx-attestation.chutes.ai keeps resolving.
    loadBalancerIP: ""
    port: 8443
    annotations: {}
  tolerations: []
  affinity: {}

# cvm-chutes-proxy: single mTLS front for ALL CVM attestation calls on cvm.chutes.ai. Deployed
# alongside the attestation-proxy LB; fronts all six /servers attestation endpoints and injects
# X-Attestation-Proxy-Auth (the API's require_attestation_proxy fails closed without it). Enable in the
# overlay once cvm.chutes.ai DNS + the LB exist. Assumes PROXY protocol in front (matches
# attestation-proxy); set realIpFrom to the real trusted sources.
cvmProxy:
  enabled: false
  replicaCount: 2
  image: nginx:1.31
  imagePullPolicy: IfNotPresent
  busyboxImage: busybox:1.36
  tlsSecretName: "chutes-tls"
  serverName: "cvm.chutes.ai"
  # Secret the render init container and the API both read (must be the SAME value, so the
  # injected X-Cvm-Proxy-Auth matches what the API enforces). Wired optional so the pod starts if
  # unprovisioned; the API guard then fails closed (503) rather than bypassing.
  proxyAuthSecret:
    name: "cvm-proxy-auth"
    key: "secret"
  # Max request body for the chute-log-shipper ingest location (bounds per-request memory, since
  # FastAPI buffers the whole JSON body before the app's line cap applies). ~8x the guest's default
  # 1 MiB batch; if a batch exceeds it, nginx 413s and the guest splits + retries smaller. Only the
  # logs location is capped; attestation stays unbounded (see cvm-proxy-cm.yaml).
  logsMaxBodySize: "8m"
  # No realIpFrom: cvm.chutes.ai routes straight to this LB (no PROXY-protocol intermediary),
  # so the client IP is $remote_addr directly (preserved via the Service's
  # externalTrafficPolicy: Local). Contrast attestationProxy, which sits behind the VM-side
  # nginx L4 stream and therefore needs set_real_ip_from + proxy_protocol.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: "1Gi"
    limits:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: "1Gi"
  service:
    type: LoadBalancer
    # Reserved static LB IP that cvm.chutes.ai resolves to (empty = GCP auto-assigns). Pin in
    # the overlay.
    loadBalancerIP: ""
    # Public HTTPS on 443 (cvm.chutes.ai connects directly, no :port suffix); LB forwards to
    # the pod's unprivileged targetPort 8443 (nginx runs non-root).
    port: 443
    annotations: {}
  tolerations: []
  affinity: {}

claudeProxy:
  enabled: false
  replicaCount: 2
  image: claude-proxy:latest
  imagePullPolicy: Always
  backendUrl: "http://api.chutes.svc.cluster.local:8000/v1/chat/completions"
