teeMinimumBootVersion: ""

squad_enabled: false

chutes_version: "0.6.9"

# Container image registry prefix. All private images are stored under this path.
# Set to empty string to use fully-qualified image values as-is.
imageRegistry: "us-central1-docker.pkg.dev/chutes-443309/chutes-prod-docker-registry"

consecutive_failure_limit: 7

prometheusUrl: "http://prometheus-server.monitoring.svc.cluster.local"

# S3/object-storage credentials secret name (key: access-key-id, secret-access-key, endpoint-url, aws-region, bucket)
s3SecretName: "s3-credentials"

# External managed Postgres (chutes-db secret) for DB_RW_URL / DB_RO_URL
chuteDb:
  enabled: false
  secretName: "chutes-db"

api:
  replicaCount: 1
  image: validator:latest
  imagePullPolicy: Always
  structuredLogRotation: "500 MB"
  limitConcurrency: 1024
  timeoutGracefulShutdown: 120
  terminationGracePeriodSeconds: 180
  dbPoolSize: 24
  dbOverflow: 8
  rateLimitCount: 10
  openclGravalUrl: "https://new-graval.chutes.ai:8443"
  rollingUpdate:
    maxSurge: "25%"
    maxUnavailable: "25%"
  livenessProbe:
    initialDelaySeconds: 40
    periodSeconds: 15
    timeoutSeconds: 7
    successThreshold: 1
    failureThreshold: 4
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
      ephemeral-storage: "2Gi"
    limits:
      cpu: "2"
      memory: "8Gi"
      ephemeral-storage: "2Gi"
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  nodeSelector: {}
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70

  # KEDA ScaledObject — when enabled, replaces the CPU-based HPA above.
  # Requires KEDA to be installed in the cluster.
  keda:
    enabled: false
    minReplicas: 2
    maxReplicas: 30
    cooldownPeriod: 300
    # Scale up when average in-flight requests per pod exceeds this value.
    targetInflightPerPod: "100"
    # Optional latency trigger (P95 end-to-end duration, includes miner time).
    latencyTrigger:
      enabled: false
      thresholdSeconds: "30"

  affinity:
    nodeAffinity: {}
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - api
          topologyKey: kubernetes.io/hostname
  tolerations: []

socket:
  image: validator:latest
  imagePullPolicy: Always
  replicaCount: 1
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
      ephemeral-storage: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
      ephemeral-storage: "1Gi"
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  nodeSelector: {}
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  affinity:
    nodeAffinity: {}
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - socket
          topologyKey: kubernetes.io/hostname
  tolerations: []

