teeMinimumBootVersion: ""

squad_enabled: false

chutes_version: "0.6.9"

# Container image registry prefix. All private images are stored under this path.
# Set to empty string to use fully-qualified image values as-is.
imageRegistry: "us-central1-docker.pkg.dev/chutes-443309/chutes-prod-docker-registry"

consecutive_failure_limit: 7

# NetworkPolicies for the workloads (reproduced from the live cluster). NOTE: 7 of the 8 select
# pods by `app: <name>`, but chart pods are labeled app.kubernetes.io/name -- so those policies
# currently match no pods and enforce nothing (only pg-router-np is active). Kept faithful for a
# no-op adoption; fixing the selectors is a deliberate, test-gated change (see template warnings).
networkPolicies:
  enabled: true
  # Egress CIDRs are environment-specific -- placeholders here (RFC5737 docs net), real ranges
  # set in the overlay. internalCidr = private range for redis/postgres/internal services;
  # proxyUpstreamCidr = the external upstream the claude/responses proxies are allowed to reach.
  internalCidr: "192.0.2.0/24"
  proxyUpstreamCidr: "192.0.2.4/32"

# nginx Ingresses for externally-routed services. Templated from the live cluster state.
# The prometheus ingress is intentionally excluded (owned by the prometheus/GMP app).
ingress:
  enabled: true
  className: "nginx"
  tlsSecretName: "ingress-tls"
  # Source-IP allowlists are infra-specific (Cloudflare ranges, GCP NAT egress, ops IPs) and are
  # set per-environment in the overlay values. Left empty here so the whitelist annotation is
  # omitted entirely when unset (no allowlist == nginx allows all).
  whitelistSourceRange: ""
  # socket-servers uses its own list (the other ingresses add a trailing ops IP); set in overlay.
  socketWhitelistSourceRange: ""

# URL of the Prometheus service used for subscription quota queries (api/invocation/util.py).
# The service name varies by deployment — override in environment values.
prometheusUrl: "http://prometheus"

# S3/object-storage credentials secret name (key: access-key-id, secret-access-key, endpoint-url, aws-region, bucket)
s3SecretName: "s3-credentials"

# External managed Postgres (chutes-db secret) for DB_RW_URL / DB_RO_URL
chuteDb:
  enabled: false
  secretName: "chutes-db"

api:
  replicaCount: 1
  image: validator:latest
  imagePullPolicy: Always
  limitConcurrency: 1024
  timeoutGracefulShutdown: 120
  terminationGracePeriodSeconds: 180
  dbPoolSize: 24
  dbOverflow: 8
  rateLimitCount: 10
  openclGravalUrl: "https://new-graval.chutes.ai:8443"
  rollingUpdate:
    maxSurge: "25%"
    maxUnavailable: "25%"
  livenessProbe:
    initialDelaySeconds: 40
    periodSeconds: 15
    timeoutSeconds: 7
    successThreshold: 1
    failureThreshold: 4
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
      ephemeral-storage: "2Gi"
    limits:
      cpu: "2"
      memory: "8Gi"
      ephemeral-storage: "2Gi"
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  nodeSelector: {}
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70

  # KEDA ScaledObject — when enabled, replaces the CPU-based HPA above (api.hpa is skipped).
  # Requires KEDA to be installed in the cluster. Defaults mirror the live prod `api-scaler`
  # so enabling it is a no-op; override per-environment as needed.
  keda:
    enabled: false
    name: api-scaler          # must match the live ScaledObject name to adopt it (KEDA names its HPA keda-hpa-<name>)
    minReplicas: 50
    maxReplicas: 200
    cooldownPeriod: 120
    pollingInterval: 15
    # HPA scaling behaviour (advanced.horizontalPodAutoscalerConfig.behavior)
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        periodSeconds: 120
        pods: 2
      scaleUp:
        stabilizationWindowSeconds: 30
        periodSeconds: 60
        pods: 3
    # Resource triggers (Utilization %). Set enabled: false to drop a trigger.
    cpu:
      enabled: true
      utilization: 65
    memory:
      enabled: true
      utilization: 75
    # Prometheus in-flight-requests trigger. serverAddress/query default in-template to the
    # in-cluster prometheus and the live prod query (namespace-substituted); override here if needed.
    inflight:
      enabled: true
      serverAddress: ""
      query: ""
      threshold: "200"

  affinity:
    nodeAffinity: {}
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - api
          topologyKey: kubernetes.io/hostname
  tolerations: []

